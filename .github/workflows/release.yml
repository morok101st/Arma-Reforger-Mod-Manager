name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          current_tag="${GITHUB_REF_NAME}"
          previous_tag="$(git tag --sort=-creatordate | grep -vx "$current_tag" | head -n 1)"

          {
            echo "## Changelog since ${previous_tag:-the previous release}"
            echo
            if [ -n "$previous_tag" ]; then
              git log --reverse --no-merges --pretty=format:'- %s' "${previous_tag}..${current_tag}"
            else
              git log --reverse --no-merges --pretty=format:'- %s' --max-count=20 "${current_tag}"
            fi
            echo
            echo
            echo "## Published images"
            echo
            echo "- \`ghcr.io/${{ github.repository_owner }}/armm-backend:${{ steps.version.outputs.version }}\`"
            echo "- \`ghcr.io/${{ github.repository_owner }}/armm-frontend:${{ steps.version.outputs.version }}\`"
            echo "- \`ghcr.io/${{ github.repository_owner }}/armm-reforger-cli:${{ steps.version.outputs.version }}\`"
          } > release-notes.md

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/armm-backend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/armm-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ghcr.io/${{ github.repository_owner }}/armm-frontend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/armm-frontend:latest

      - name: Build and push Reforger metadata service image
        uses: docker/build-push-action@v6
        with:
          context: ./reforger-cli
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/armm-reforger-cli:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/armm-reforger-cli:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md

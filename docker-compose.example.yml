services:
  db:
    image: postgres:16-alpine
    container_name: armm-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-armm}
      POSTGRES_USER: ${POSTGRES_USER:-armm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-armm}
    volumes:
      - armm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-armm} -d ${POSTGRES_DB:-armm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: armm-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://armm:armm@db:5432/armm}
      WORKSHOP_BASE_URL: ${WORKSHOP_BASE_URL:-https://reforger.armaplatform.com/workshop}
      SCRAPE_INTERVAL_MINUTES: ${SCRAPE_INTERVAL_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-/api}
    container_name: armm-frontend
    depends_on:
      - backend
    networks:
      - default
      - traefik_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      - "traefik.http.routers.armm.entrypoints=websecure"
      - "traefik.http.routers.armm.rule=Host(`armm.example.com`)"
      - "traefik.http.services.armm.loadbalancer.server.port=80"
      - "traefik.http.routers.armm.tls=true"
      - "traefik.http.routers.armm.tls.certresolver=production"
      - "traefik.http.routers.armm.tls.domains[0].main=example.com"
      - "traefik.http.routers.armm.tls.domains[0].sans=*.example.com"

volumes:
  armm-db-data:

networks:
  traefik_default:
    external: true
